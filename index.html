<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#fbf1df;--card:#fffaf0;--tx:#2b1a10;--mu:#8a7256;--ac:#d6410d;--gold:#a9752c;--bd:#e8d7b4;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:16px system-ui,sans-serif;padding-bottom:170px}
h1,h2,h3{font-family:'Playfair Display',Georgia,serif}
.hero{background:linear-gradient(160deg,#1b120a,#3a1c0f 55%,#5e2410);color:#f6e7c9;padding:18px 14px 22px;border-radius:0 0 28px 28px;box-shadow:0 10px 24px rgba(20,8,2,.35);border-bottom:2px solid #caa54e}
.hero .t{display:flex;align-items:center;gap:12px;max-width:760px;margin:auto}.hero svg{width:56px;height:56px;flex:none}
.hero h1{margin:0;font-size:27px;letter-spacing:.5px;color:#f1cd7e}.hero small{display:block;opacity:.85;font-size:12px;color:#d9c3a0}
.hero .ct{display:flex;gap:8px;max-width:760px;margin:12px auto 0;flex-wrap:wrap}.hero a{text-decoration:none}.hero button.g{background:transparent;color:#f1cd7e;border:1px solid #caa54e}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:9px 14px;background:var(--ac);color:#fff8ec;font-weight:600;letter-spacing:.2px}button.g{background:transparent;color:var(--tx);border:1px solid var(--gold)}
nav{display:flex;gap:8px;overflow-x:auto;padding:10px 12px;position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:4;max-width:760px;margin:auto}nav button{white-space:nowrap}
main{padding:0 12px;max-width:760px;margin:auto}h2{margin:18px 0 10px;font-size:23px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(min-width:700px){.grid{grid-template-columns:1fr 1fr 1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;overflow:hidden}.card.off{opacity:.45}
.img{height:120px;display:flex;align-items:center;justify-content:center;background:linear-gradient(160deg,#2a1710,#4a2512);background-size:cover;background-position:center;position:relative}
.hot{position:absolute;top:8px;left:8px;background:var(--ac);color:#fff;font-size:11px;padding:3px 8px;border-radius:999px;font-weight:700}
.card .b{padding:10px}.card h3{margin:0 0 8px;font-size:15px;line-height:1.25;font-weight:700}
.sz{display:flex;flex-wrap:wrap;gap:6px}.sz button{font-size:13px;padding:6px 10px;background:transparent;border:1px solid var(--gold);color:var(--tx)}
.deal{background:linear-gradient(90deg,#2a1710,#4a2512);color:#f1cd7e;border:1px solid #caa54e;border-radius:12px;padding:10px 14px;margin:8px 0;font-weight:700}
.it,.pn{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin:10px 0}.it{margin:8px 0}.it b{display:block}
.row{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center}
input,select,textarea{font:inherit;width:100%;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--tx);margin:4px 0}
#bar{position:fixed;left:10px;right:10px;bottom:70px;padding:10px 14px;background:#2a1710;color:#f1cd7e;border-radius:999px;box-shadow:0 6px 18px rgba(0,0,0,.35);display:none;justify-content:space-between;align-items:center;max-width:740px;margin:auto;border:1px solid #caa54e}#bar button{background:var(--ac);color:#fff}
.pn input.p{width:90px}.st{font-size:13px;color:var(--mu)}.tag{font-size:12px;padding:2px 8px;border-radius:999px;background:var(--bd)}table{width:100%;border-collapse:collapse}td{padding:4px 2px;border-bottom:1px solid var(--bd);font-size:14px}
#rc{display:none;width:72mm;font:12px/1.4 monospace;color:#000;background:#fff}#rc table{width:100%}#rc td{border:0;padding:1px 0;font-size:12px}
@media print{body>*:not(#rc){display:none!important}#rc{display:block!important}}

:root[data-theme=dark]{--bg:#140d07;--card:#211608;--tx:#f3e4c8;--mu:#c2a97e;--gold:#e3b24d;--bd:#3a2a14;--ac:#ff6a2e;color-scheme:dark}
[data-theme=dark] input,[data-theme=dark] select,[data-theme=dark] textarea{background:#241a0d}
[data-theme=dark] button.g{color:#f3e4c8;border-color:#e3b24d}[data-theme=dark] .sz button{border-color:#e3b24d;color:#f3e4c8}
[data-theme=dark] .img{background:linear-gradient(160deg,#1a1109,#3a2210)}[data-theme=dark] .fv{background:#241a0d}
.sz button{font-size:15px;padding:8px 12px}.sz button small{opacity:.8;font-size:12px}.sz button b{font-size:19px}
.it span{font-size:18px;font-weight:700}#bar b{font-size:21px}.card{animation:up .35s both;transition:transform .15s}.card:active{transform:scale(.98)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.fv{position:absolute;top:8px;right:8px;background:var(--card);border-radius:50%;width:34px;height:34px;padding:0;font-size:18px;line-height:34px;border:1px solid var(--bd)}

const bd=ts=>new Date(ts-36e5).toLocaleDateString("en-GB");
function prCount(){const d=bd(Date.now());let c=ld("cd_pc",{d:"",n:0});if(c.d!=d)c={d,n:0};c.n++;sv("cd_pc",c);return c.n}
const prToday=()=>{const c=ld("cd_pc",{d:"",n:0});return c.d==bd(Date.now())?c.n:0};
function nextBn(){const d=bd(Date.now());let c=ld("cd_bn",{d:"",n:0});if(c.d!=d)c={d,n:0};c.n++;sv("cd_bn",c);return c.n}
const XC=["Gosht","Petrol","Sabzi","Other"],XE={Gosht:"🥩",Petrol:"⛽",Sabzi:"🥬",Other:"🧾"};
function expH(){const today=bd(Date.now()),te=exp.filter(x=>x.t==today),sm=(a,c)=>a.filter(x=>!c||x.d==c).reduce((q,x)=>q+x.a,0),
cats=[...XC,...[...new Set(exp.map(x=>x.d))].filter(d=>!XC.includes(d))],
sale=orders.filter(o=>bd(o.id)==today&&o.st!="Cancel").reduce((q,o)=>q+o.tot,0),
li=x=>`<div class="st">${x.t} • ${XE[x.d]||"🧾"} ${esc(x.d)}${x.n?" • "+esc(x.n):""} • <b>${rs(x.a)}</b> <button class="g" onclick="delExp(${x.id})">🗑️</button></div>`;
return `<div class="pn"><b>💸 Kharcha (Expenses)</b><div class="row"><select id="ec" style="flex:1">${XC.map(c=>`<option>${c}</option>`).join("")}</select><input id="ea" type="number" inputmode="numeric" placeholder="Amount" style="flex:1"></div><input id="ed" placeholder="Tafseel (optional) e.g. 5 kg boti"><button onclick="addExp()">＋ Kharcha shamil karein</button>
<table style="margin-top:8px"><tr><td><b>Category</b></td><td align="right"><b>Aaj</b></td><td align="right"><b>Kul</b></td></tr>${cats.map(c=>`<tr><td>${XE[c]||"🧾"} ${esc(c)}</td><td align="right">${rs(sm(te,c))}</td><td align="right">${rs(sm(exp,c))}</td></tr>`).join("")}<tr><td><b>Total</b></td><td align="right"><b>${rs(sm(te))}</b></td><td align="right"><b>${rs(sm(exp))}</b></td></tr></table>
<div class="st">Aaj: Sale ${rs(sale)} − Kharcha ${rs(sm(te))} = <b>${rs(sale-sm(te))}</b></div>
<div class="st" style="margin-top:6px"><b>Aakhri entries:</b></div>${exp.slice(0,15).map(li).join("")||'<div class="st">Koi kharcha darj nahi</div>'}</div>`}
let ud=ld("cd_ud",[]),udOpen="",udKeys=[];
const un=s=>(s||"").trim().toLowerCase();
function udRows(){const m={},g=n=>{const k=un(n)||"(naam nahi)";return m[k]=m[k]||{nm:(n||"").trim()||"(naam nahi)",deb:0,cr:0,ent:[]}};
orders.filter(o=>o.pm=="Udhar"&&!o.paid&&o.st!="Cancel").forEach(o=>{const r=g(o.nm);r.deb+=o.tot;r.ent.push({id:o.id,t:bd(o.id),k:"d",a:o.tot,n:"Order"+(o.bn?" #"+o.bn:""),ord:1})});
ud.forEach(e=>{const r=g(e.nm);if(e.k=="d")r.deb+=e.a;else r.cr+=e.a;r.ent.push(e)});return m}
const udTotal=()=>Object.values(udRows()).reduce((q,r)=>q+Math.max(0,r.deb-r.cr),0);
function udH(){const m=udRows(),rows=Object.entries(m).map(([k,r])=>Object.assign({k,b:r.deb-r.cr},r)).sort((a,b)=>b.b-a.b);udKeys=rows.map(r=>r.k);
return `<div class="pn"><b>📒 Udhar Khata</b><div class="st">Kul baqaya: <b>${rs(udTotal())}</b> • ${rows.filter(r=>r.b>0).length} customers</div><div class="st">Counter order mein payment "Udhar" chunein to order khud customer ke naam par likh jaye ga.</div>
<div class="row"><input id="un" placeholder="Customer ka naam" style="flex:1"><input id="ua" type="number" inputmode="numeric" placeholder="Amount" style="flex:1"></div><input id="uno" placeholder="Note (optional)"><div class="row"><button onclick="addUd('d')">＋ Udhar likhein</button><button class="g" onclick="addUd('c')">💵 Wasooli (jama)</button></div>
${rows.map((r,i)=>`<div class="it"><b>${esc(r.nm)} <span style="float:right">${rs(r.b)}</span></b><div class="st">Udhar ${rs(r.deb)} • Wasool ${rs(r.cr)}</div><div class="row"><button class="g" onclick="payUd(${i})">💵 Wasooli</button><button class="g" onclick="udOpen=udOpen==='${i}'?'':'${i}';R()">📜 Tafseel</button></div>${udOpen===String(i)?r.ent.sort((a,b)=>b.id-a.id).map(e=>`<div class="st">${e.t} • ${e.k=="d"?"Udhar":"Wasooli"} <b>${rs(e.a)}</b>${e.n?" • "+esc(e.n):""}${e.ord?"":` <button class="g" onclick="delUd(${e.id})">🗑️</button>`}</div>`).join(""):""}</div>`).join("")||'<div class="st">Koi udhar nahi</div>'}</div>`}
function addUd(k){const g=i=>document.getElementById(i).value.trim(),nm=g("un"),a=+g("ua");if(!nm||!a||a<=0){alert("Naam aur amount likhein");return}ud.unshift({id:Date.now(),t:bd(Date.now()),nm,a,k,n:g("uno")});sv("cd_ud",ud);R()}
function payUd(i){const r=udRows()[udKeys[i]];if(!r)return;const a=+prompt(r.nm+" ka baqaya "+(r.deb-r.cr)+". Kitni raqam wasool hui?");if(!a||a<=0)return;ud.unshift({id:Date.now(),t:bd(Date.now()),nm:r.nm,a,k:"c",n:""});sv("cd_ud",ud);R()}
function delUd(id){if(!confirm("Ye entry hata dein?"))return;ud=ud.filter(x=>x.id!=id);sv("cd_ud",ud);R()}
let cx="",cgv="";
const CK=[["C","C"],["⌫","B"],["÷","/"],["×","*"],["7"],["8"],["9"],["−","-"],["4"],["5"],["6"],["+","+"],["1"],["2"],["3"],["=","="],["0"],["00"],["."],["Total","T"]];
const cf=x=>x.replace(/\*/g,"×").replace(/\//g,"÷")||"0";
function cbT(){const g=+cgv,t=total()+fee()-dsc();return g?(g>=t?"Wapsi: "+rs(g-t):"Kam: "+rs(t-g)):""}
function calcH(){return `<div class="pn"><b>🧮 Calculator</b><div id="cdisp" style="font:700 26px monospace;text-align:right;min-height:40px;padding:6px 10px;border:1px solid var(--bd);border-radius:10px;margin:6px 0;overflow-x:auto">${cf(cx)}</div><div style="display:grid;grid-template-columns:repeat(4,1fr);gap:6px">${CK.map(k=>`<button class="${/^[0-9.]/.test(k[0])?"g":""}" style="padding:12px 0;font-size:18px" onclick="cc('${k[1]||k[0]}')">${k[0]}</button>`).join("")}</div><div class="st" style="margin-top:8px">Customer ne diye → wapsi:</div><div class="row"><input type="number" inputmode="numeric" placeholder="Customer ne kitne diye" value="${esc(cgv)}" oninput="cgv=this.value;document.getElementById('cbk').textContent=cbT()" style="flex:1"><b id="cbk">${cbT()}</b></div></div>`}
function cc(k){if(k=="C")cx="";else if(k=="B")cx=cx.slice(0,-1);else if(k=="T"){if(!cx||/[+\-*\/(]$/.test(cx))cx+=String(total()+fee()-dsc())}else if(k=="="){try{if(/^[0-9+\-*\/.() ]+$/.test(cx)){const r=Function('"use strict";return ('+cx+')')();if(isFinite(r))cx=String(Math.round(r*100)/100)}}catch(e){}}else cx+=k;const d=document.getElementById("cdisp");if(d)d.textContent=cf(cx)}
{const _c0=cartV;cartV=function(){return (adm?calcH():"")+_c0()}}

/* ===== v3: roznamcha (daily register), floating calculator ===== */
const dk=d=>d.split("/").reverse().join("");
const opn=ld("cd_open",{});
function setOpen(d,v){opn[d]=+v||0;sv("cd_open",opn);R()}
function allDays(){const m={};orders.forEach(o=>{if(o.st!="Cancel")m[bd(o.id)]=1});exp.forEach(x=>m[x.t]=1);ud.forEach(x=>m[x.t]=1);Object.keys(opn).forEach(d=>m[d]=1);return Object.keys(m).sort((a,b)=>dk(a)<dk(b)?-1:1)}
function dayStat(d,memo){memo=memo||{};if(memo[d])return memo[d];
const os=orders.filter(o=>bd(o.id)==d&&o.st!="Cancel"),sum=a=>a.reduce((q,o)=>q+o.tot,0);
const cash=sum(os.filter(o=>o.paid&&(o.pm=="Cash"||o.pm=="COD"||!o.pm))),dig=sum(os.filter(o=>o.paid&&o.pm&&o.pm!="Cash"&&o.pm!="COD"&&o.pm!="Udhar")),
udg=sum(os.filter(o=>o.pm=="Udhar"&&!o.paid)),unp=sum(os.filter(o=>!o.paid&&o.pm!="Udhar")),
was=ud.filter(x=>x.t==d&&x.k=="c").reduce((q,x)=>q+x.a,0),
ex=exp.filter(x=>x.t==d),exT=ex.reduce((q,x)=>q+x.a,0);
let open=opn[d],auto=false;if(open==null){const prev=allDays().filter(x=>dk(x)<dk(d)).pop();open=prev?dayStat(prev,memo).close:0;auto=true}
const r={d,n:os.length,sale:sum(os),cash,dig,udg,unp,was,ex,exT,open,auto,close:open+cash+was-exT};memo[d]=r;return r}
function regH(d,showAll){const r=dayStat(d),cats=[...XC,...[...new Set(r.ex.map(x=>x.d))].filter(c=>!XC.includes(c))],line=(a,b,bold)=>`<tr><td>${a}</td><td align="right">${bold?"<b>"+b+"</b>":b}</td></tr>`;
return `<div class="pn"><b>📒 Roznamcha — ${d}</b> <span class="tag">${r.n} orders</span>
<div class="st">Opening (subah dukan ke galle mein jitni raqam thi):</div>
<input type="number" inputmode="numeric" value="${r.open}" onchange="setOpen('${d}',this.value)">${r.auto?'<div class="st">Pichle din ki closing se khud aayi hai. Badalni ho to likh dein.</div>':""}
<table style="margin-top:6px">${line("Kul sale",rs(r.sale),1)}${line("&nbsp;&nbsp;Cash sale",rs(r.cash))}${line("&nbsp;&nbsp;JazzCash/Easypaisa/Card",rs(r.dig))}${line("&nbsp;&nbsp;Udhar par diya",rs(r.udg))}${r.unp?line("&nbsp;&nbsp;Abhi payment nahi mili",rs(r.unp)):""}${line("Udhar wasooli (cash mila)",rs(r.was))}
<tr><td colspan="2"><b>Kharcha</b></td></tr>${cats.map(c=>line("&nbsp;&nbsp;"+(XE[c]||"🧾")+" "+esc(c),rs(r.ex.filter(x=>x.d==c).reduce((q,x)=>q+x.a,0)))).join("")}${line("Kul kharcha",rs(r.exT),1)}</table>
<h2 style="margin:8px 0 2px">Closing: ${rs(r.close)}</h2><div class="st">Closing = Opening ${rs(r.open)} + Cash sale ${rs(r.cash)} + Wasooli ${rs(r.was)} − Kharcha ${rs(r.exT)}</div>
<div class="st">Net kamai (sale − kharcha): <b>${rs(r.sale-r.exT)}</b></div>${showAll?"":'<div class="row"><button class="g" onclick="view=\'history\';R()">📅 Pichle dinon ka roznamcha</button></div>'}</div>`}
function histV(){const days=allDays().reverse();return `<h2>📅 Pichla Roznamcha</h2><div class="row"><button class="g" onclick="view='admin';R()">← Dashboard</button></div>${days.map(d=>regH(d,1)).join("")||'<div class="st">Abhi koi record nahi</div>'}`}
