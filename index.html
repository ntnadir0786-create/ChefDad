async function poll(){if(!adm||!okApi()||!st.key)return;try{const d=await api("action=list");if(!d.orders)return;const nw=[];d.orders.forEach(c=>{if(delIds.includes(c.id))return;const l=orders.find(x=>x.id==c.id);if(!l){orders.unshift(c);nw.push(c)}else if(l.st!=c.st){const PRI={Naya:0,Tayyar:1,Delivered:2,Cancel:3};if((PRI[c.st]||0)>(PRI[l.st]||0))l.st=c.st}});if(nw.length){orders.sort((a,b)=>b.id-a.id);sv("cd_orders",orders);beep();R();if(st.aop)nw.forEach((o,i)=>setTimeout(()=>pr(o.id),i*2000))}}catch(e){}}
